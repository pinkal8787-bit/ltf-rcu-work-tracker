/* =====================================================

const AUTH_URL =
"https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="

/* =====================================================
   FIRESTORE REST
===================================================== */

/* =====================================================
   HELPERS
===================================================== */

const $ = id => document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m]));

}


function today(){

  const d = new Date();

  return d.toISOString().slice(0,10);

}


function statusOf(work){

  if(work.status === "Completed"){
    return "Completed";
  }

  if(work.due && work.due < today()){
    return "Overdue";
  }

  return "Pending";

}


function statusClass(status){

  if(status === "Completed"){
    return "bg";
  }

  if(status === "Overdue"){
    return "br";
  }

  return "by";

}


/* =====================================================
   LOGIN EMAIL
===================================================== */

function loginEmail(value){

  value = value.trim();

  /*
     अगर पूरा email दिया है तो वही इस्तेमाल होगा.
     Employee ID दिया गया हो तो उसे local format में
     convert किया जाएगा.
  */

  if(value.includes("@")){
    return value;
  }

  return value.toLowerCase()
    .replace(/[^a-z0-9]/g,"")
    + "@ltf-rcu.local";

}


/* =====================================================
   FIREBASE AUTH LOGIN
===================================================== */

async function firebaseLogin(email,password){

  const response = await fetch(AUTH_URL,{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      email:email,
      password:password,
      returnSecureToken:true
    })

  });


  const data = await response.json();


  if(!response.ok){

    let message = "Login failed";

    if(data.error && data.error.message){
      message = data.error.message;
    }

    throw new Error(message);

  }


  return data;

}


/* =====================================================
   FIRESTORE VALUE CONVERTER
===================================================== */

function firestoreValue(value){

  if(value === null || value === undefined){
    return {nullValue:null};
  }

  if(typeof value === "string"){
    return {stringValue:value};
  }

  if(typeof value === "boolean"){
    return {booleanValue:value};
  }

  if(typeof value === "number"){

    if(Number.isInteger(value)){
      return {integerValue:String(value)};
    }

    return {doubleValue:value};
  }

  return {stringValue:String(value)};

}


/* =====================================================
   FIRESTORE DOCUMENT CONVERTER
===================================================== */

function firestoreFields(data){

  const fields = {};

  Object.keys(data).forEach(key => {

    fields[key] = firestoreValue(data[key]);

  });

  return fields;

}


function firestoreDocToObject(doc){

  const data = {};

  const fields = doc.fields || {};

  Object.keys(fields).forEach(key => {

    const f = fields[key];

    if(f.stringValue !== undefined){
      data[key] = f.stringValue;
    }

    else if(f.integerValue !== undefined){
      data[key] = Number(f.integerValue);
    }

    else if(f.doubleValue !== undefined){
      data[key] = f.doubleValue;
    }

    else if(f.booleanValue !== undefined){
      data[key] = f.booleanValue;
    }

    else if(f.timestampValue !== undefined){
      data[key] = f.timestampValue;
    }

    else if(f.nullValue !== undefined){
      data[key] = null;
    }

  });

  return data;

}


/* =====================================================
   FIRESTORE GET DOCUMENT
===================================================== */

async function firestoreGet(path){

  const response = await fetch(
    FIRESTORE_BASE + "/" + path,
    {
      headers:{
        "Authorization":"Bearer " + currentUser.idToken
      }
    }
  );


  const data = await response.json();


  if(!response.ok){

    throw new Error(
      data.error?.message || "Firestore read failed"
    );

  }


  return data;

}


/* =====================================================
   FIRESTORE LIST COLLECTION
===================================================== */

async function firestoreList(collectionName){

  const response = await fetch(
    FIRESTORE_BASE + "/" + collectionName,
    {
      headers:{
        "Authorization":"Bearer " + currentUser.idToken
      }
    }
  );


  const data = await response.json();


  if(!response.ok){

    throw new Error(
      data.error?.message || "Firestore collection read failed"
    );

  }


  return data.documents || [];

}


/* =====================================================
   FIRESTORE ADD DOCUMENT
===================================================== */

async function firestoreAdd(collectionName,data){

  const response = await fetch(
    FIRESTORE_BASE + "/" + collectionName,
    {
      method:"POST",

      headers:{
        "Authorization":"Bearer " + currentUser.idToken,
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        fields:firestoreFields(data)
      })

    }
  );


  const result = await response.json();


  if(!response.ok){

    throw new Error(
      result.error?.message || "Firestore add failed"
    );

  }


  return result;

}


/* =====================================================
   FIRESTORE UPDATE DOCUMENT
===================================================== */

async function firestoreUpdate(collectionName,id,data){

  const fieldNames = Object.keys(data);

  const updateMask = fieldNames
    .map(x => "updateMask.fieldPaths=" + encodeURIComponent(x))
    .join("&");


  const response = await fetch(
    FIRESTORE_BASE
    + "/"
    + collectionName
    + "/"
    + encodeURIComponent(id)
    + "?"
    + updateMask,
    {
      method:"PATCH",

      headers:{
        "Authorization":"Bearer " + currentUser.idToken,
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        fields:firestoreFields(data)
      })

    }
  );


  const result = await response.json();


  if(!response.ok){

    throw new Error(
      result.error?.message || "Firestore update failed"
    );

  }


  return result;

}


/* =====================================================
   FIRESTORE DELETE
===================================================== */

async function firestoreDelete(collectionName,id){

  const response = await fetch(
    FIRESTORE_BASE
    + "/"
    + collectionName
    + "/"
    + encodeURIComponent(id),
    {
      method:"DELETE",

      headers:{
        "Authorization":"Bearer " + currentUser.idToken
      }
    }
  );


  if(!response.ok){

    const result = await response.json();

    throw new Error(
      result.error?.message || "Firestore delete failed"
    );

  }

}

async function loadProfile(){

  }

  currentProfile = {
    uid:currentUser.localId,
    ...firestoreDocToObject(doc)
  };

/* =====================================================
   LOAD CRM
===================================================== */

async function loadCRM(){

  const userDocs =
    await firestoreList("users");

  employees =
    userDocs
      .map(doc => ({
        uid:doc.name.split("/").pop(),
        ...firestoreDocToObject(doc)
      }))
      .filter(x => x.role === "employee");


  works =
    (await firestoreList("work"))
      .map(doc => ({
        id:doc.name.split("/").pop(),
        ...firestoreDocToObject(doc)
      }));


  populateEmployees();

  drawCRM();


  $("assign").onclick = assignWork;

  $("filterMember").onchange = drawCRM;

  $("filterStatus").onchange = drawCRM;

  $("search").oninput = drawCRM;

  $("logout").onclick = logout;

}

/* =====================================================
   ASSIGN WORK
===================================================== */

async function assignWork(){

  const work = $("work").value.trim();

  const employeeUid =
    $("member").value;

  const due =
    $("due").value;

  const remarks =
    $("remarks").value.trim();


  if(!work || !employeeUid || !due){

    $("crmMsg").textContent =
      "Work, Employee और Due Date जरूरी हैं।";

    $("crmMsg").className = "msg";

    return;

  }


  const employee =
    employees.find(x => x.uid === employeeUid);


  if(!employee){

    $("crmMsg").textContent =
      "Employee नहीं मिला।";

    return;

  }


  try{

    $("assign").disabled = true;

    $("assign").textContent =
      "Assigning...";


    await firestoreAdd("work",{

      work:work,

      assignedUid:employee.uid,

      employeeName:
        employee.name || "Employee",

      employeeId:
        employee.employeeId || "",

      crmName:
        currentProfile.name || "Vishal Singh",

      due:due,

      note:remarks,

      status:"Pending"

    });


    $("crmMsg").textContent =
      "✓ Work successfully assigned.";

    $("crmMsg").className =
      "msg success";


    $("work").value = "";

    $("due").value = "";

    $("remarks").value = "";


    works =
      (await firestoreList("work"))
        .map(doc => ({
          id:doc.name.split("/").pop(),
          ...firestoreDocToObject(doc)
        }));


    drawCRM();

  }

  catch(error){

    console.error(error);

    $("crmMsg").textContent =
      "Error: " + error.message;

    $("crmMsg").className = "msg";

  }

  finally{

    $("assign").disabled = false;

    $("assign").textContent =
      "Work Assign करें";

  }

}


/* =====================================================
   CRM DRAW
===================================================== */

function drawCRM(){

  if(!$("rows")){
    return;
  }


  $("total").textContent =
    works.length;


  $("done").textContent =
    works.filter(
      x => statusOf(x) === "Completed"
    ).length;


  $("pending").textContent =
    works.filter(
      x => statusOf(x) === "Pending"
    ).length;


  $("overdue").textContent =
    works.filter(
      x => statusOf(x) === "Overdue"
    ).length;


  /* TEAM */

  const members = {};


  works.forEach(work => {

    const name =
      work.employeeName || "Unknown";


    if(!members[name]){

      members[name] = {

        employeeId:
          work.employeeId || "",

        assigned:0,

        completed:0,

        pending:0,

        overdue:0

      };

    }


    members[name].assigned++;


    const status =
      statusOf(work);


    if(status === "Completed"){
      members[name].completed++;
    }

    if(status === "Pending"){
      members[name].pending++;
    }

    if(status === "Overdue"){
      members[name].overdue++;
    }

  });


  $("teamRows").innerHTML =
    Object.entries(members)
      .map(([name,data]) => `

<tr>

<td>
<b>${esc(name)}</b>
</td>

<td>
${esc(data.employeeId)}
</td>

<td>
${data.assigned}
</td>

<td class="green">
${data.completed}
</td>

<td class="yellow">
${data.pending}
</td>

<td class="red">
${data.overdue}
</td>

</tr>

      `)
      .join("");


  /* FILTER */

  const memberFilter =
    $("filterMember").value;

  const statusFilter =
    $("filterStatus").value;

  const search =
    $("search").value
      .toLowerCase()
      .trim();


  const list =
    works.filter(work => {

      const matchesMember =
        !memberFilter ||
        work.employeeName === memberFilter;


      const matchesStatus =
        !statusFilter ||
        statusOf(work) === statusFilter;


      const text =
        (
          (work.work || "") +
          " " +
          (work.employeeName || "") +
          " " +
          (work.employeeId || "") +
          " " +
          (work.note || "")
        ).toLowerCase();


      const matchesSearch =
        !search ||
        text.includes(search);


      return (
        matchesMember &&
        matchesStatus &&
        matchesSearch
      );

    });


  if(!list.length){

    $("rows").innerHTML = `

<tr>
<td colspan="7" class="empty">
अभी कोई work नहीं है।
</td>
</tr>

    `;

    return;

  }


  $("rows").innerHTML =
    list.map(work => {

      const status =
        statusOf(work);

      const cls =
        statusClass(status);


      return `

<tr>

<td>
<b>${esc(work.work)}</b>
</td>

<td>
${esc(work.employeeName)}
</td>

<td>
${esc(work.employeeId || "-")}
</td>

<td>
${esc(work.due || "-")}
</td>

<td>
${esc(work.note || "-")}
</td>

<td>
<span class="badge ${cls}">
${status}
</span>
</td>

<td>

<div class="action-buttons">

${
status !== "Completed"

?

`

<button
class="greenbtn"
onclick="completeWork('${esc(work.id)}')"
>
✓ Complete
</button>

`

:

`<span class="badge bg">✓ Done</span>`

}


<button
class="redbtn"
onclick="deleteWork('${esc(work.id)}')"
>
Delete
</button>

</div>

</td>

</tr>

      `;

    }).join("");

}

  drawEmployee();

  $("logout").onclick = logout;

}


/* =====================================================
   EMPLOYEE DRAW
===================================================== */

function drawEmployee(){

  const total =
    works.length;


  const done =
    works.filter(
      x => statusOf(x) === "Completed"
    ).length;


  const pending =
    works.filter(
      x => statusOf(x) === "Pending"
    ).length;


  const overdue =
    works.filter(
      x => statusOf(x) === "Overdue"
    ).length;


  $("empTotal").textContent = total;

  $("empDone").textContent = done;

  $("empPending").textContent = pending;

  $("empOverdue").textContent = overdue;


  if(!works.length){

    $("employeeRows").innerHTML = `

<tr>
<td colspan="6" class="empty">
आपको अभी कोई work assign नहीं हुआ है।
</td>
</tr>

    `;

    return;

  }


  $("employeeRows").innerHTML =
    works.map(work => {

      const status =
        statusOf(work);

      const cls =
        statusClass(status);


      return `

<tr>

<td>
<b>${esc(work.work)}</b>
</td>

<td>
${esc(work.crmName || "Vishal Singh")}
</td>

<td>
${esc(work.due || "-")}
</td>

<td>
${esc(work.note || "-")}
</td>

<td>

<span class="badge ${cls}">
${status}
</span>

</td>

<td>

${
status !== "Completed"

?

`

<button
class="greenbtn"
onclick="completeWork('${esc(work.id)}')"
>
✓ Complete
</button>

`

:

`<span class="badge bg">✓ Done</span>`

}

</td>

</tr>

      `;

    }).join("");

}


/* =====================================================
   COMPLETE WORK
===================================================== */

window.completeWork = async function(id){

  try{

    await firestoreUpdate(
      "work",
      id,
      {
        status:"Completed"
      }
    );


    if(currentProfile.role === "crm"){

      works =
        (await firestoreList("work"))
          .map(doc => ({
            id:doc.name.split("/").pop(),
            ...firestoreDocToObject(doc)
          }));

      drawCRM();

    }

    else{

      works =
        (await firestoreList("work"))
          .map(doc => ({
            id:doc.name.split("/").pop(),
            ...firestoreDocToObject(doc)
          }))
          .filter(
            x => x.assignedUid === currentUser.localId
          );

      drawEmployee();

    }

  }

  catch(error){

    alert(
      "Complete करने में error: "
      + error.message
    );

  }

};


/* =====================================================
   DELETE WORK
===================================================== */

window.deleteWork = async function(id){

  if(
    !confirm("क्या आप यह work delete करना चाहते हैं?")
  ){
    return;
  }


  try{

    await firestoreDelete(
      "work",
      id
    );


    works =
      (await firestoreList("work"))
        .map(doc => ({
          id:doc.name.split("/").pop(),
          ...firestoreDocToObject(doc)
        }));


    if(currentProfile.role === "crm"){

      drawCRM();

    }

    else{

      works =
        works.filter(
          x =>
            x.assignedUid ===
            currentUser.localId
        );

      drawEmployee();

    }

  }

  catch(error){

    alert(
      "Delete करने में error: "
      + error.message
    );

  }

};


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  currentUser = null;

  currentProfile = null;

  works = [];

  employees = [];


  $("main").innerHTML = "";

  $("main").classList.add("hide");

  $("login").classList.remove("hide");

  $("uid").value = "";

  $("pw").value = "";

  $("err").textContent = "";

}


/* =====================================================
   START APPLICATION
===================================================== */

async function startApp(){

  try{

    $("login").classList.add("hide");

    $("main").classList.remove("hide");

    $("main").innerHTML = `

      <div class="card">
        <h3>Loading...</h3>
        <p>Firebase data load हो रहा है...</p>
      </div>

    `;


    await loadProfile();


    if(
      currentProfile.role === "crm"
    ){

      $("main").innerHTML =
        crmView();

      await loadCRM();

    }

    else{

      $("main").innerHTML =
        employeeView(currentProfile);

      await loadEmployee();

    }

  }

  catch(error){

    console.error(error);

    $("main").classList.add("hide");

    $("login").classList.remove("hide");

    $("err").textContent =
      "Error: " + error.message;

  }

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

$("go").onclick = async function(){

  const email =
    $("uid").value.trim();

  const password =
    $("pw").value;


  $("err").textContent = "";


  if(!email || !password){

    $("err").textContent =
      "Email और Password दोनों भरें।";

    return;

  }


  try{

    $("go").disabled = true;

    $("go").textContent =
      "Logging in...";


    const result =
      await firebaseLogin(
        loginEmail(email),
        password
      );


    currentUser = result;


    await startApp();

  }

  catch(error){

    console.error(error);

    $("err").textContent =
      "Login failed: "
      + error.message;


    $("go").disabled = false;

    $("go").textContent =
      "Login";

  }

};


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

$("pw").addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      $("go").click();

    }

  }
);

</script>
