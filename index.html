<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L&T Finance • RCU Work Tracker</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f5f7;
color:#17202a
}

header{
background:#152238;
color:#fff;
padding:16px 18px
}

.brand{
font-size:21px;
font-weight:700
}

.sub{
font-size:12px;
opacity:.8;
margin-top:4px
}

.wrap{
max-width:1200px;
margin:auto;
padding:16px
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card,.panel{
background:#fff;
border-radius:12px;
padding:16px;
margin-top:16px;
box-shadow:0 2px 10px #00000012
}

.num{
font-size:28px;
font-weight:700;
margin-top:5px
}

.blue{color:#2563a8}
.green{color:#159447}
.yellow{color:#b77900}
.red{color:#d63031}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

input,select,button{
width:100%;
padding:11px;
border:1px solid #cfd5db;
border-radius:8px;
font-size:14px
}

button{
background:#152238;
color:#fff;
border:0;
font-weight:700;
cursor:pointer
}

.greenbtn{background:#159447}
.redbtn{background:#d63031}

table{
width:100%;
border-collapse:collapse;
margin-top:14px
}

th,td{
padding:10px 8px;
border-bottom:1px solid #e9ecef;
text-align:left;
font-size:13px;
vertical-align:top
}

th{
background:#f7f8fa
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:20px;
font-size:11px;
font-weight:700
}

.bg{
background:#dff5e7;
color:#11713a
}

.by{
background:#fff0c9;
color:#8a5b00
}

.br{
background:#ffe0e0;
color:#a51f1f
}

.hide{
display:none
}

.msg{
margin-top:10px;
color:#b00020
}

@media(max-width:800px){

.cards{
grid-template-columns:1fr 1fr
}

.grid{
grid-template-columns:1fr
}

table{
display:block;
overflow:auto;
white-space:nowrap
}

}
</style>
</head>

<body>

<header>
<div class="brand">L&T Finance • RCU Work Tracker</div>
<div class="sub">Risk Manager Dashboard • Prince Pandey</div>
</header>

<div class="wrap">

<div class="card" id="login">

<h2>Login</h2>

<input
id="uid"
placeholder="CRM Email / Employee ID"
>

<br><br>

<input
id="pw"
type="password"
placeholder="Password"
>

<br><br>

<button id="go">
Login
</button>

<p id="err" class="msg"></p>

</div>

<div id="main" class="hide"></div>

</div>


<script>

const API_KEY =
"AIzaSyC25Iz4o4Af9OyD02lYIZU7PWLOuWNMCIY";


const PROJECT_ID =
"ltf-rcu-work-tracker";


const AUTH_URL =
"https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="
+API_KEY;


const FIRESTORE =
"https://firestore.googleapis.com/v1/projects/"
+PROJECT_ID
+"/databases/(default)/documents";


let currentUser=null;
let works=[];


const $=id=>
document.getElementById(id);


const esc=s=>
String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function loginEmail(v){

if(v.includes("@"))
return v;

return v.toLowerCase()
.replace(/[^a-z0-9]/g,"")
+"@ltf-rcu.local";

}


function statusOf(x){

if(x.status==="Completed")
return "Completed";

if(x.due && x.due<today())
return "Overdue";

return "Pending";

}


/* FIRESTORE VALUE HELPERS */

function fsString(v){

return {
stringValue:String(v??"")
};

}


function fsBool(v){

return {
booleanValue:Boolean(v)
};

}


function fsFields(obj){

const out={};

for(const key in obj){

const value=obj[key];

if(value===undefined)
continue;

if(typeof value==="boolean"){

out[key]=fsBool(value);

}else{

out[key]=fsString(value);

}

}

return out;

}


function readValue(v){

if(!v)
return null;

if(v.stringValue!==undefined)
return v.stringValue;

if(v.booleanValue!==undefined)
return v.booleanValue;

if(v.integerValue!==undefined)
return Number(v.integerValue);

if(v.doubleValue!==undefined)
return Number(v.doubleValue);

return "";

}


function readDoc(d){

const obj={
id:d.name.split("/").pop()
};

const fields=d.fields||{};

for(const key in fields){

obj[key]=readValue(fields[key]);

}

return obj;

}


/* FIRESTORE REST */

async function firestoreGet(path){

const r=
await fetch(
FIRESTORE+"/"+path,
{
headers:{
Authorization:
"Bearer "+currentUser.idToken
}
}
);


if(!r.ok){

const text=await r.text();

throw new Error(
"Firestore GET "+r.status+": "+text
);

}

return r.json();

}


async function firestoreList(collection){

const r=
await fetch(
FIRESTORE+"/"+collection,
{
headers:{
Authorization:
"Bearer "+currentUser.idToken
}
}
);


if(!r.ok){

const text=await r.text();

throw new Error(
"Firestore LIST "+r.status+": "+text
);

}


const data=await r.json();

return (data.documents||[])
.map(readDoc);

}


/* FIRESTORE QUERY */

async function firestoreQuery(collectionName){

const url=
FIRESTORE+":runQuery";


const body={

structuredQuery:{

from:[
{
collectionId:collectionName
}
]

}

};


const r=
await fetch(
url,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+currentUser.idToken
},

body:JSON.stringify(body)
}
);


if(!r.ok){

const text=await r.text();

throw new Error(
"Firestore QUERY "+r.status+": "+text
);

}


const data=await r.json();

return data
.filter(x=>x.document)
.map(x=>readDoc(x.document));

}


/* CREATE */

async function firestoreCreate(collectionName,data){

const r=
await fetch(
FIRESTORE+"/"+collectionName,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+currentUser.idToken
},

body:JSON.stringify({
fields:fsFields(data)
})
}
);


if(!r.ok){

const text=await r.text();

throw new Error(
"CREATE "+r.status+": "+text
);

}

return r.json();

}


/* UPDATE */

async function firestoreUpdate(
collectionName,
id,
data
){

const r=
await fetch(
FIRESTORE+
"/"+
collectionName+
"/"+
id+
"?updateMask.fieldPaths="+
Object.keys(data).join("&updateMask.fieldPaths="),

{
method:"PATCH",

headers:{
"Content-Type":
"application/json",

Authorization:
"Bearer "+currentUser.idToken
},

body:JSON.stringify({
fields:fsFields(data)
})
}
);


if(!r.ok){

const text=await r.text();

throw new Error(
"UPDATE "+r.status+": "+text
);

}

return r.json();

}


/* DELETE */

async function firestoreDelete(
collectionName,
id
){

const r=
await fetch(
FIRESTORE+
"/"+
collectionName+
"/"+
id,

{
method:"DELETE",

headers:{
Authorization:
"Bearer "+currentUser.idToken
}
}
);


if(!r.ok){

const text=await r.text();

throw new Error(
"DELETE "+r.status+": "+text
);

}

}


/* LOGIN */

$("go").onclick=async()=>{

const err=$("err");

err.textContent="";

const email=
loginEmail(
$("uid").value.trim()
);

const password=
$("pw").value;


if(!email||!password){

err.textContent=
"Email और Password दोनों भरें।";

return;

}


$("go").textContent=
"Logging in...";

$("go").disabled=true;


try{

const r=
await fetch(
AUTH_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:email,

password:password,

returnSecureToken:true

})
}
);


const data=
await r.json();


if(!r.ok){

throw new Error(
data.error?.message||
"Login failed"
);

}


currentUser={

uid:data.localId,

email:data.email,

idToken:data.idToken

};


await start();


}catch(e){

console.error(e);

err.textContent=
e.message;


$("go").textContent=
"Login";

$("go").disabled=false;

}

};


/* START */

async function start(){

try{

const me=
await firestoreGet(
"users/"+currentUser.uid
);


const profile=
readDoc(me);


$("login")
.classList.add("hide");


$("main")
.classList.remove("hide");


$("main").innerHTML=
profile.role==="crm"
?crmView()
:employeeView(profile);


if(profile.role==="crm"){

await loadCRM();

}else{

await loadEmployee(profile);

}


}catch(e){

console.error(e);

$("err").textContent=
e.message;

}

}


/* CRM VIEW */

function crmView(){

return`

<div class="cards">

<div class="card">
Total Work
<div class="num blue" id="total">0</div>
</div>

<div class="card">
Completed
<div class="num green" id="done">0</div>
</div>

<div class="card">
Pending
<div class="num yellow" id="pending">0</div>
</div>

<div class="card">
TAT Crossed
<div class="num red" id="overdue">0</div>
</div>

</div>


<div class="panel">

<h3>Team</h3>

<table>

<thead>
<tr>
<th>Name</th>
<th>Designation</th>
<th>Assigned</th>
<th>Completed</th>
<th>Pending</th>
</tr>
</thead>

<tbody id="teamRows"></tbody>

</table>

</div>


<div class="panel">

<h3>नया Work Assign करें</h3>

<div class="grid">

<input
id="work"
placeholder="Work / Client / Task"
>

<select id="member">
<option value="">Select Employee</option>
</select>

<input id="due" type="date">

<input
id="email"
placeholder="Employee Email (optional)"
>

<input
id="remarks"
placeholder="Remarks / Instruction"
>

<button id="assign">
Work Assign करें
</button>

</div>

<p id="crmMsg"></p>

</div>


<div class="panel">

<h3>Work List</h3>

<div class="grid">

<select id="filterMember">
<option value="">सभी Team Members</option>
</select>

<select id="filterStatus">

<option value="">
सभी Status
</option>

<option>Pending</option>
<option>Completed</option>
<option>Overdue</option>

</select>

<input
id="search"
placeholder="Work / Client Search"
>

</div>


<table>

<thead>

<tr>
<th>Work</th>
<th>Assigned To</th>
<th>Due Date</th>
<th>Remarks</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

<br>

<button id="logout">
Logout
</button>

`;

}


/* EMPLOYEE VIEW */

function employeeView(me){

return`

<div class="panel">

<h2>
${esc(me.name||"Employee")}
</h2>

<p>
Employee ID:
${esc(me.employeeId||"-")}
</p>

</div>


<div class="panel">

<h3>My Assigned Work</h3>

<table>

<thead>

<tr>
<th>Work</th>
<th>CRM</th>
<th>TAT</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

<br>

<button id="logout">
Logout
</button>

`;

}


/* CRM LOAD */

async function loadCRM(){

try{

const employees=
await firestoreList("users");


const emps=
employees.filter(
x=>x.role==="employee"
);


$("member").innerHTML=
emps.length

?

emps.map(x=>
`<option value="${x.id}">
${esc(x.name)}
(${esc(x.employeeId||"")})
</option>`
).join("")

:

`<option value="">
No employee found
</option>`;


$("filterMember").innerHTML=
`<option value="">
सभी Team Members
</option>`
+
emps.map(x=>
`<option value="${x.name}">
${esc(x.name)}
</option>`
).join("");


works=
await firestoreList("work");


drawCRM();


$("assign").onclick=
async()=>{

try{

const emp=
emps.find(
x=>x.id===$("member").value
);


if(
!$("work").value.trim()
||
!emp
||
!$("due").value
){

$("crmMsg").textContent=
"Work, Employee और Due Date जरूरी हैं।";

return;

}


await firestoreCreate(
"work",
{

work:$("work").value.trim(),

assignedUid:emp.id,

employeeName:emp.name,

employeeId:emp.employeeId||"",

email:$("email").value.trim(),

crmName:"Vishal Singh",

due:$("due").value,

note:$("remarks").value.trim(),

status:"Pending",

createdAt:new Date().toISOString()

}
);


$("crmMsg").textContent=
"Work successfully assigned.";


$("work").value="";
$("email").value="";
$("remarks").value="";


works=
await firestoreList("work");


drawCRM();


}catch(e){

$("crmMsg").textContent=
e.message;

}

};


$("filterMember").onchange=
drawCRM;

$("filterStatus").onchange=
drawCRM;

$("search").oninput=
drawCRM;


$("logout").onclick=
logout;

}


/* CRM DRAW */

function drawCRM(){

$("total").textContent=
works.length;


$("done").textContent=
works.filter(
x=>statusOf(x)==="Completed"
).length;


$("pending").textContent=
works.filter(
x=>statusOf(x)==="Pending"
).length;


$("overdue").textContent=
works.filter(
x=>statusOf(x)==="Overdue"
).length;


const members={};


works.forEach(x=>{

const n=
x.employeeName||"Unknown";


if(!members[n]){

members[n]={
assigned:0,
completed:0,
pending:0
};

}


members[n].assigned++;


if(statusOf(x)==="Completed")
members[n].completed++;


if(statusOf(x)==="Pending")
members[n].pending++;

});


$("teamRows").innerHTML=
Object.entries(members)
.map(([name,x])=>
`<tr>
<td><b>${esc(name)}</b></td>
<td>Employee</td>
<td>${x.assigned}</td>
<td class="green">${x.completed}</td>
<td class="yellow">${x.pending}</td>
</tr>`
).join("");


const fm=$("filterMember").value;
const fs=$("filterStatus").value;
const q=$("search").value.toLowerCase();


const list=
works.filter(x=>

(!fm||
x.employeeName===fm)

&&

(!fs||
statusOf(x)===fs)

&&

(!q||
(
x.work+" "+
x.employeeName+" "+
(x.note||"")
)
.toLowerCase()
.includes(q))

);


$("rows").innerHTML=
list.length

?

list.map(x=>{

const s=
statusOf(x);


const cls=
s==="Completed"
?"bg"
:
s==="Overdue"
?"br"
:
"by";


return`

<tr>

<td>
<b>${esc(x.work)}</b>
</td>

<td>
${esc(x.employeeName)}
</td>

<td>
${esc(x.due)}
</td>

<td>
${esc(x.note||"")}
</td>

<td>
<span class="badge ${cls}">
${s}
</span>
</td>

<td>

${
s!=="Completed"

?

`<button
class="greenbtn"
onclick="completeWork('${x.id}')">
✓ Complete
</button>`

:

"✓ Done"
}

<br><br>

<button
class="redbtn"
onclick="deleteWork('${x.id}')">
Delete
</button>

</td>

</tr>

`;

}).join("")

:

`<tr>
<td colspan="6">
अभी कोई work नहीं है।
</td>
</tr>`;

}


/* EMPLOYEE */

async function loadEmployee(me){

works=
await firestoreQuery("work");


works=
works.filter(
x=>x.assignedUid===me.id
);


$("rows").innerHTML=
works.map(x=>{

const s=
statusOf(x);


const cls=
s==="Completed"
?"bg"
:
s==="Overdue"
?"br"
:
"by";


return`

<tr>

<td>
${esc(x.work)}
</td>

<td>
${esc(x.crmName||"Vishal Singh")}
</td>

<td>
${esc(x.due)}
</td>

<td>

<span class="badge ${cls}">
${s}
</span>

</td>

<td>

${
s!=="Completed"

?

`<button
class="greenbtn"
onclick="completeWork('${x.id}')">
✓ Complete
</button>`

:

"✓ Done"
}

</td>

</tr>

`;

}).join("");


$("logout").onclick=
logout;

}


/* COMPLETE */

window.completeWork=
async id=>{

try{

await firestoreUpdate(
"work",
id,
{
status:"Completed",
completedAt:new Date().toISOString()
}
);


location.reload();


}catch(e){

alert(e.message);

}

};


/* DELETE */

window.deleteWork=
async id=>{

if(!confirm("यह work delete करें?"))
return;


try{

await firestoreDelete(
"work",
id
);


location.reload();


}catch(e){

alert(e.message);

}

};


/* LOGOUT */

function logout(){

currentUser=null;

location.reload();

}

</script>

</body>
</html>
